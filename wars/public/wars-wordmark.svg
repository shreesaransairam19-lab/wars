<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 112" role="img" aria-labelledby="title desc">
  <title id="title">WARS</title>
  <desc id="desc">World Anime Review System</desc>
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f7ff" />
      <stop offset=".56" stop-color="#b8adff" />
      <stop offset="1" stop-color="#5ee7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
