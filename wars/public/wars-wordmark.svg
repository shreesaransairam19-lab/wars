  <path d="M24 75h370" stroke="#5ee7ff" stroke-opacity=".75" stroke-width="2" />
  <text x="25" y="95" fill="#e3e6ff" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.25">WORLD ANIME REVIEW SYSTEM</text>
